<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240" role="img" aria-label="A small code bonsai growing in a pot">
<style>
  .sway, .sun, .leaf { transform-box: fill-box; }
  .sway { transform-origin: 50% 100%; animation: sway 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  .sun { transform-origin: 50% 50%; animation: sun 4s ease-in-out infinite; }
  @keyframes sun { 50% { transform: scale(1.12); opacity: .75; } }
  .leaf { transform-origin: 50% 50%; animation: leaf 7s ease-in-out infinite; }
  @keyframes leaf { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-60px,120px) rotate(200deg); opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E07A4F"/><stop offset="100%" stop-color="#B9583A"/></linearGradient>
  <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6DBB76"/><stop offset="100%" stop-color="#2F7A45"/></linearGradient>
</defs>
<circle class="sun" cx="176" cy="40" r="18" fill="#F4C25B"/>
<path class="leaf" d="M150 70 q10 -8 20 0 q-10 9 -20 0 Z" fill="#5DAA68"/>
<ellipse cx="110" cy="230" rx="70" ry="7" fill="#000" opacity=".07"/>
<g class="sway">
  <path d="M110 186 C106 160 120 146 112 124 C106 108 92 100 84 90" stroke="#6B4A33" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M112 136 C126 126 140 124 150 112" stroke="#6B4A33" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="80" cy="82" rx="46" ry="28" fill="url(#canopy)"/>
  <ellipse cx="150" cy="104" rx="38" ry="22" fill="url(#canopy)"/>
  <ellipse cx="112" cy="66" rx="34" ry="22" fill="#5DAA68"/>
  <text x="80" y="88" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F5F4F0" text-anchor="middle">&lt;/&gt;</text>
</g>
<path d="M58 186 L162 186 L150 228 L70 228 Z" fill="url(#pot)"/>
<rect x="50" y="178" width="120" height="14" rx="5" fill="#C9653F"/>
<text x="104" y="216" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#F5F4F0" text-anchor="middle">git grow</text>
<rect class="blink" x="138" y="205" width="3" height="13" fill="#F5F4F0"/>
</svg>
